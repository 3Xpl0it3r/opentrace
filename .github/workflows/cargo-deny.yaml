name: Cargo Deny

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  schedule:
    - cron: '0 0 * * *'  
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deny:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      
      - name: Run cargo deny
        # 只跑 advisories（漏洞）/ bans（依赖禁用）/ sources（来源白名单），
        # 跳过 licenses 检查（项目暂不强制 license 合规）。
        # 想恢复时改回 `cargo deny check` 即可。
        run: cargo deny check advisories bans sources
