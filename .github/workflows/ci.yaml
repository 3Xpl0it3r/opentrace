name: CI

on:
  push:
    branches: [ "master" ]
    paths-ignore:
      - '**.md' 
      - 'images/**'
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_MIN: "1.95.0"

jobs:
  # 代码格式与风格检查
  fmt:
    name: Format & Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # 拉 git submodule（libbpf）
          submodules: recursive

      - name: Setup Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry / git deps / target
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          # 跟 crap.yaml 用不同 key，避免互相覆盖
          shared-key: ci
          # 显式标注被缓存的目录（默认就包含，写出来方便排查）
          #   ~/.cargo/registry/index    crates.io index
          #   ~/.cargo/registry/cache    .crate 压缩包
          #   ~/.cargo/git/db            git deps 的 bare 仓库
          #   ~/.cargo/git/checkouts     git deps 的 checkout（如 vmlinux.h）
          #   target/                    编译产物

      - name: Install eBPF dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang \
            llvm \
            libelf-dev \
            zlib1g-dev \
            libbpf-dev \
            pkg-config

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy (warnings as errors)
        run: cargo clippy --workspace --all-targets -- -D warnings

