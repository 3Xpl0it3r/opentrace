<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OpenTrace — Agent 详情</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#08080B;--bg-surface:#0C0C10;--bg-panel:#101014;--bg-elevated:#161620;--bg-hover:#1C1C28;--border:#1A1A24;--border-light:#2C2C3A;--text:#F0F0F5;--text-secondary:#9CA3AF;--text-muted:#5C6370;--cyan:#00D4FF;--cyan-50:rgba(0,212,255,.05);--cyan-100:rgba(0,212,255,.10);--cyan-glow:0 0 24px rgba(0,212,255,.12);--green:#22C55E;--green-bg:rgba(34,197,94,.10);--yellow:#F59E0B;--yellow-bg:rgba(245,158,11,.10);--red:#EF4444;--red-bg:rgba(239,68,68,.10);--font:'IBM Plex Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;--mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;--radius:10px;--radius-sm:6px;--radius-pill:100px;--shadow-card:0 1px 3px rgba(0,0,0,.3);--gradient-bar:linear-gradient(90deg,transparent,rgba(0,212,255,.15),transparent);--gradient-bar-subtle:linear-gradient(90deg,transparent,rgba(0,212,255,.1),transparent)}
html.light{--bg:#F5F5F7;--bg-surface:#FFFFFF;--bg-panel:#FFFFFF;--bg-elevated:#F0F0F2;--bg-hover:#E8E8EC;--border:#E0E0E4;--border-light:#C8C8CE;--text:#111111;--text-secondary:#6B7280;--text-muted:#9CA3AF;--cyan-50:rgba(0,140,200,.05);--cyan-100:rgba(0,140,200,.10);--cyan-glow:0 0 16px rgba(0,140,200,.10);--green:#16A34A;--green-bg:rgba(22,163,74,.08);--yellow:#D97706;--yellow-bg:rgba(217,119,6,.08);--red:#DC2626;--red-bg:rgba(220,38,38,.08);--shadow-card:0 1px 3px rgba(0,0,0,.08);--gradient-bar:linear-gradient(90deg,transparent,rgba(0,140,200,.12),transparent);--gradient-bar-subtle:linear-gradient(90deg,transparent,rgba(0,140,200,.08),transparent)}
html{font-size:14px;-webkit-font-smoothing:antialiased}body{font-family:var(--font);background:var(--bg);color:var(--text);line-height:1.5;min-height:100vh;}a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}

.topbar{height:56px;background:var(--bg-surface);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 28px;position:sticky;top:0;z-index:100;}
.topbar-left{display:flex;align-items:center;gap:10px;margin-right:40px}
.topbar-logo{width:28px;height:28px;background:linear-gradient(135deg,var(--cyan),#0090B3);border-radius:7px;display:flex;align-items:center;justify-content:center;box-shadow:var(--cyan-glow)}
.topbar-logo svg{width:16px;height:16px;fill:white}
.topbar-brand{font-size:14px;font-weight:700;letter-spacing:-.01em}
.topbar-brand small{display:block;font-size:10px;font-weight:400;color:var(--text-muted)}
.topbar-nav{display:flex;gap:2px;flex:1}
.topbar-nav a{padding:8px 16px;font-size:13px;font-weight:500;color:var(--text-secondary);text-decoration:none;border-radius:var(--radius-sm);transition:all .15s;position:relative}
.topbar-nav a:hover{color:var(--text);background:var(--bg-hover)}
.topbar-nav a.active{color:var(--cyan);background:var(--cyan-50)}
.topbar-nav a.active::after{content:'';position:absolute;bottom:-1px;left:12px;right:12px;height:2px;background:var(--cyan);border-radius:2px 2px 0 0}
.topbar-right{display:flex;align-items:center;gap:14px}
.topbar-time{font-family:var(--mono);font-size:12px;color:var(--text-muted)}
.live-indicator{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--green);font-weight:500}
.live-dot{width:7px;height:7px;border-radius:50%;background:var(--green);animation:pulse 2s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1;box-shadow:0 0 0 0 rgba(34,197,94,.4)}50%{opacity:.6;box-shadow:0 0 0 4px rgba(34,197,94,0)}}

.theme-btn{width:34px;height:34px;border-radius:var(--radius-sm);border:1px solid var(--border);background:var(--bg-panel);color:var(--text-secondary);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s;font-size:16px}
.theme-btn:hover{border-color:var(--cyan);color:var(--cyan);background:var(--cyan-50)}
.theme-btn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

.user-menu{position:relative}
.user-avatar{width:34px;height:34px;border-radius:var(--radius-sm);background:var(--cyan);color:#000;font-weight:700;font-size:14px;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .2s;border:1px solid transparent}
.user-avatar:hover{box-shadow:var(--cyan-glow);border-color:var(--cyan)}
.user-dropdown{display:none;position:absolute;top:calc(100% + 8px);right:0;background:var(--bg-panel);border:1px solid var(--border);border-radius:var(--radius);min-width:180px;box-shadow:0 8px 24px rgba(0,0,0,.4);z-index:200;overflow:hidden}
.user-dropdown.show{display:block}
.user-dropdown-hd{padding:14px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px}
.user-dropdown-av{width:36px;height:36px;border-radius:var(--radius-sm);background:var(--cyan);color:#000;font-weight:700;font-size:16px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.user-dropdown-info{flex:1;min-width:0}
.user-dropdown-name{font-size:13px;font-weight:600}
.user-dropdown-role{font-size:11px;color:var(--text-muted)}
.user-dropdown-item{display:flex;align-items:center;gap:10px;padding:10px 16px;font-size:13px;color:var(--text-secondary);cursor:pointer;transition:all .15s}
.user-dropdown-item:hover{background:var(--bg-hover);color:var(--text)}
.user-dropdown-item svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.user-dropdown-item.danger{color:var(--red)}
.user-dropdown-item.danger:hover{background:var(--red-bg)}
.user-dropdown-divider{height:1px;background:var(--border);margin:4px 0}

.content{max-width:1440px;margin:0 auto;padding:28px 32px 60px}
.breadcrumb{font-size:12px;color:var(--text-muted);margin-bottom:20px}.breadcrumb a{color:var(--cyan)}.breadcrumb .sep{margin:0 4px}
.ah{display:flex;align-items:center;gap:20px;margin-bottom:24px;padding:24px 28px;background:var(--bg-panel);border:1px solid var(--border);border-radius:var(--radius);position:relative;overflow:hidden;transition:all .3s}
.ah::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:var(--gradient-bar)}
.sd{width:14px;height:14px;border-radius:50%;flex-shrink:0}
.sd.online{background:var(--green);box-shadow:0 0 12px rgba(34,197,94,.4)}
.sd.degraded{background:var(--yellow);box-shadow:0 0 12px rgba(245,158,11,.3)}
.sd.offline{background:var(--red);box-shadow:0 0 12px rgba(239,68,68,.3)}
.hi{flex:1}.hi h1{font-size:20px;font-weight:700;letter-spacing:-.02em}
.hm{display:flex;align-items:center;gap:16px;margin-top:6px;font-size:12px;color:var(--text-muted);font-family:var(--mono)}
.hm .dm{width:3px;height:3px;border-radius:50%;background:var(--text-muted)}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.tags span{font-size:10px;padding:3px 10px;border-radius:var(--radius-pill);background:var(--cyan-100);color:var(--cyan);font-weight:600}
.badge{font-size:12px;font-weight:600;padding:5px 16px;border-radius:var(--radius-pill)}
.badge.online{background:var(--green-bg);color:var(--green)}.badge.degraded{background:var(--yellow-bg);color:var(--yellow)}.badge.offline{background:var(--red-bg);color:var(--red)}

.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:24px}
.stat{background:var(--bg-panel);border:1px solid var(--border);border-radius:var(--radius);padding:16px 18px;position:relative;overflow:hidden;transition:all .3s}
.stat::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:var(--gradient-bar-subtle)}
.stat .sl{font-size:10px;color:var(--text-muted);font-weight:600;text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px}
.stat .sv{font-size:24px;font-weight:700;font-family:var(--mono);letter-spacing:-.03em;line-height:1}
.stat .ss{font-size:11px;color:var(--text-secondary);margin-top:6px;display:flex;align-items:center;gap:4px}
.stat .ss .d{width:5px;height:5px;border-radius:50%}

.section-h{display:flex;align-items:center;gap:12px;margin-bottom:14px;padding-bottom:12px;border-bottom:1px solid var(--border)}.section-h h3{font-size:15px;font-weight:600}.section-h .cnt{font-family:var(--mono);font-size:12px;color:var(--text-muted);background:var(--bg-surface);padding:2px 8px;border-radius:var(--radius-pill)}

.sink-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:12px}
.sink-card{background:var(--bg-panel);border:1px solid var(--border);border-radius:var(--radius);padding:18px 20px;transition:all .2s;position:relative;overflow:hidden}
.sink-card::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:var(--gradient-bar-subtle)}
.sink-card:hover{border-color:var(--cyan);box-shadow:var(--cyan-glow);transform:translateY(-1px)}
.sink-top{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.sink-type-icon{width:32px;height:32px;border-radius:var(--radius-sm);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;font-family:var(--mono);flex-shrink:0}
.sink-type-icon.Kafka{background:var(--cyan-100);color:var(--cyan)}
.sink-type-icon.Elasticsearch{background:var(--green-bg);color:var(--green)}
.sink-type-icon.Prometheus{background:var(--yellow-bg);color:var(--yellow)}
.sink-name{font-size:14px;font-weight:600;flex:1}
.sink-meta{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--text-muted)}
.sink-status{font-size:11px;font-weight:600;padding:3px 10px;border-radius:var(--radius-pill)}
.sink-status.healthy{background:var(--green-bg);color:var(--green)}
.sink-status.degraded{background:var(--yellow-bg);color:var(--yellow)}
.sink-status.unhealthy{background:var(--red-bg);color:var(--red)}

.btn{padding:9px 20px;font-size:13px;font-weight:600;border-radius:var(--radius-sm);cursor:pointer;transition:all .15s;font-family:var(--font);border:none;display:inline-flex;align-items:center;gap:6px}
.btn-danger{background:var(--red-bg);color:var(--red);border:1px solid rgba(239,68,68,.2)}
.btn-danger:hover{background:rgba(239,68,68,.18)}
.btn-danger:active{transform:scale(.97)}

.empty-state{text-align:center;padding:60px 20px;color:var(--text-muted)}.empty-state p{font-size:14px;margin-bottom:4px}.empty-state small{font-size:12px}

.modal-overlay{display:none;position:fixed;inset:0;width:100vw;height:100vh;background:rgba(0,0,0,.4);z-index:1000;align-items:center;justify-content:center;padding:16px}
.modal-overlay.show{display:flex}
.modal{background:var(--bg-panel);border:1px solid var(--border);border-radius:var(--radius);width:420px;max-height:85vh;overflow-y:auto;box-shadow:0 8px 40px rgba(0,0,0,.5)}
.modal-header{padding:18px 24px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.modal-header h3{font-size:16px;font-weight:600}
.modal-close{width:28px;height:28px;border-radius:var(--radius-sm);border:none;background:transparent;color:var(--text-muted);cursor:pointer;font-size:18px;display:flex;align-items:center;justify-content:center;transition:all .15s}
.modal-close:hover{color:var(--text);background:var(--bg-hover)}
.modal-body{padding:20px 24px}
.modal-footer{padding:16px 24px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:8px}
.btn-ghost{background:transparent;border:1px solid var(--border);color:var(--text-secondary);font-family:var(--font)}
.btn-ghost:hover{border-color:var(--border-light);color:var(--text)}

@media(max-width:1200px){.stats{grid-template-columns:repeat(2,1fr)}}
@media(max-width:768px){.stats{grid-template-columns:1fr}.sink-grid{grid-template-columns:1fr}.ah{flex-direction:column;align-items:flex-start}.modal{width:calc(100vw - 32px);margin:16px}}
</style>
</head>
<body>
<nav class="topbar">
  <div class="topbar-left">
    <div class="topbar-logo"><svg viewBox="0 0 24 24"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg></div>
    <div class="topbar-brand">OpenTrace<small>Observability Platform</small></div>
  </div>
  <div class="topbar-nav">
    <a href="index.html">Dashboard</a>
    <a href="agents.html" class="active">Agents</a>
    <a href="sinks.html">Sinks</a>
  </div>
  <div class="topbar-right">
    <div class="live-indicator"><span class="live-dot" aria-hidden="true"></span>LIVE</div>
    <div class="topbar-time" id="clock" aria-live="polite">--:--:--</div>
    <button class="theme-btn" onclick="toggleTheme()" aria-label="切换主题">
      <svg id="icon-moon" viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1111.21 3a7 7 0 009.79 9.79z"/></svg>
      <svg id="icon-sun" viewBox="0 0 24 24" style="display:none"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
    </button>
    <div class="user-menu" id="user-menu">
      <button class="user-avatar" id="user-avatar" onclick="toggleDropdown()" aria-haspopup="true" aria-expanded="false" aria-label="用户菜单">A</button>
      <div class="user-dropdown" id="user-dropdown" role="menu">
        <div class="user-dropdown-hd">
          <div class="user-dropdown-av" id="dd-av">A</div>
          <div class="user-dropdown-info"><div class="user-dropdown-name" id="dd-name">Admin</div><div class="user-dropdown-role" id="dd-role">管理员</div></div>
        </div>
        <div class="user-dropdown-divider"></div>
        <div class="user-dropdown-item danger" role="menuitem" tabindex="0" onclick="logout()" onkeydown="if(event.key==='Enter')logout()">
          <svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4M16 17l5-5-5-5M21 12H9"/></svg>
          退出登录
        </div>
      </div>
    </div>
  </div>
</nav>
<main class="content">
  <div class="breadcrumb"><a href="agents.html">Agents</a><span class="sep">/</span><span id="bc">—</span></div>
  <div id="app"></div>
</main>

<div class="modal-overlay" id="modal-delete" role="dialog" aria-modal="true" aria-labelledby="delete-title">
  <div class="modal">
    <div class="modal-header">
      <h3 id="delete-title">确认删除</h3>
      <button class="modal-close" onclick="closeModal('delete')" aria-label="关闭">&times;</button>
    </div>
    <div class="modal-body">
      <p style="color:var(--text-secondary);font-size:13px;line-height:1.6">确定要删除 <strong id="del-name" style="color:var(--text)"></strong> 吗？<br><br>此操作不可撤销，所有 Sink 关联也将被移除。</p>
    </div>
    <div class="modal-footer">
      <button class="btn btn-ghost" onclick="closeModal('delete')">取消</button>
      <button class="btn btn-danger" id="del-confirm">删除</button>
    </div>
  </div>
</div>

<script src="/js/api.js"></script>
<script src="/js/auth.js"></script>
<script>
if (!checkAuth()) location.href = '/login.html';

var urlParams = new URLSearchParams(location.search);
var agentId = urlParams.get('id');
var agent = null;
var sinks = [];

function fm(n) { if(n>=1e6) return (n/1e6).toFixed(1)+'M'; if(n>=1e3) return (n/1e3).toFixed(1)+'K'; return String(n); }
function fu(s) { if(!s) return '—'; var d=Math.floor(s/86400),h=Math.floor((s%86400)/3600); return d>0?d+'d '+h+'h':h+'h'; }
function stL(s) { return {online:'在线',degraded:'降级',offline:'离线'}[s]||s; }
function skI(t) { return {Kafka:'K',Elasticsearch:'E',Prometheus:'P'}[t]||'?'; }

async function loadAgent() {
  try {
    agent = await api.getAgent(agentId);
    document.getElementById('bc').textContent = agent.name;
    document.title = 'OpenTrace — ' + agent.name;
    render();
  } catch (err) {
    console.error('Failed to load agent:', err);
    document.getElementById('app').innerHTML = '<p style="color:var(--text-muted);text-align:center;padding:60px">Agent 未找到</p>';
  }
}

async function loadSinks() {
  try {
    var allSinks = await api.listSinks();
    var agentSinks = [];
    for (var i = 0; i < allSinks.length; i++) {
      try {
        var agents = await api.getSinkAgents(allSinks[i].id);
        var found = false;
        for (var j = 0; j < agents.length; j++) {
          if (String(agents[j].id) === String(agentId) || String(agents[j]) === String(agentId)) {
            found = true;
            break;
          }
        }
        if (found) agentSinks.push(allSinks[i]);
      } catch (e) {}
    }
    sinks = agentSinks;
    render();
  } catch (err) {
    console.error('Failed to load sinks:', err);
  }
}

function render() {
  var app = document.getElementById('app');
  if (!app || !agent) return;

  var status = agent.status || 'online';
  var cpu = agent.cpu || 0;
  var memory = agent.memory || 0;
  var rate = agent.rate || 0;
  var uptime = agent.uptime || 0;
  var tags = [];

  try {
    if (agent.tags) {
      tags = typeof agent.tags === 'string' ? JSON.parse(agent.tags) : agent.tags;
    }
  } catch (e) { tags = []; }

  var h = '';

  h += '<div class="ah">';
  h += '<span class="sd ' + status + '"></span>';
  h += '<div class="hi">';
  h += '<h1>' + agent.name + '</h1>';
  h += '<div class="hm">';
  h += '<span>' + agent.host + '</span>';
  h += '<span class="dm"></span>';
  h += '<span>' + (agent.group_name || '默认分组') + '</span>';
  h += '<span class="dm"></span>';
  h += '<span>' + fu(uptime) + '</span>';
  h += '<span class="dm"></span>';
  h += '<span>CPU ' + cpu + '%</span>';
  h += '<span class="dm"></span>';
  h += '<span>RAM ' + memory + '%</span>';
  h += '</div>';
  if (tags.length > 0) {
    h += '<div class="tags">' + tags.map(function(t) { return '<span>' + t + '</span>'; }).join('') + '</div>';
  }
  h += '</div>';
  h += '<span class="badge ' + status + '">' + stL(status) + '</span>';
  h += '</div>';

  h += '<div class="stats">';
  h += '<div class="stat"><div class="sl">关联 Sinks</div><div class="sv">' + sinks.length + '</div><div class="ss">数据输出端</div></div>';
  h += '<div class="stat"><div class="sl">吞吐量</div><div class="sv">' + fm(rate) + '/s</div><div class="ss">当前速率</div></div>';
  h += '<div class="stat"><div class="sl">CPU 使用率</div><div class="sv">' + cpu + '%</div><div class="ss">处理器负载</div></div>';
  h += '<div class="stat"><div class="sl">内存使用率</div><div class="sv" style="color:' + (memory > 80 ? 'var(--red)' : 'inherit') + '">' + memory + '%</div><div class="ss">RAM 占用</div></div>';
  h += '</div>';

  h += '<div class="section-h"><h3>关联 Sinks</h3><span class="cnt">' + sinks.length + '</span></div>';

  if (sinks.length > 0) {
    h += '<div class="sink-grid">';
    sinks.forEach(function(s) {
      var sinkStatus = s.status || 'healthy';
      h += '<div class="sink-card">';
      h += '<div class="sink-top">';
      h += '<div class="sink-type-icon ' + s.sink_type + '">' + skI(s.sink_type) + '</div>';
      h += '<span class="sink-name">' + s.name + '</span>';
      h += '<span class="sink-status ' + sinkStatus + '">' + ({healthy:'健康',degraded:'降级',unhealthy:'异常'}[sinkStatus]||sinkStatus) + '</span>';
      h += '</div>';
      h += '<div class="sink-meta"><span>' + s.sink_type + '</span></div>';
      h += '</div>';
    });
    h += '</div>';
  } else {
    h += '<div class="empty-state"><p>暂无关联 Sink</p><small>在 Sinks 页面中绑定此 Agent</small></div>';
  }

  h += '<div style="margin-top:32px;padding-top:24px;border-top:1px solid var(--border)">';
  h += '<button class="btn btn-danger" onclick="openDelete()">删除 Agent</button>';
  h += '</div>';

  app.innerHTML = h;
}

function openDelete() {
  if (!agent) return;
  document.getElementById('del-name').textContent = agent.name;
  document.getElementById('del-confirm').onclick = async function() {
    try {
      await api.deleteAgent(agentId);
      closeModal('delete');
      location.href = 'agents.html';
    } catch (err) {
      alert('删除失败: ' + err.message);
    }
  };
  var overlay = document.getElementById('modal-delete');
  overlay.classList.add('show');
}

function closeModal(type) {
  var overlay = document.getElementById('modal-' + type);
  if (overlay) overlay.classList.remove('show');
}

document.querySelectorAll('.modal-overlay').forEach(function(el) {
  el.addEventListener('click', function(e) { if(e.target === el) el.classList.remove('show'); });
});
document.addEventListener('keydown', function(e) {
  if(e.key === 'Escape') {
    document.querySelectorAll('.modal-overlay.show').forEach(function(el) { el.classList.remove('show'); });
  }
});

initCommon();
if (agentId) {
  loadAgent();
  loadSinks();
  setInterval(function() { loadAgent(); }, 5000);
} else {
  document.getElementById('app').innerHTML = '<p style="color:var(--text-muted);text-align:center;padding:60px">缺少 Agent ID 参数</p>';
}
</script>
</body>
</html>
