[package]
name = "opentrace-cli"
publish.workspace = true
edition.workspace = true
version.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "CLI tool for platform control and debugging"

[[bin]]
name = "opentrace-cli"  
path = "src/bin/opentrace.rs"

[dependencies]
opentrace-bpf = {workspace = true}
# libc = { workspace = true } 
clap = {workspace = true}
thiserror = { workspace = true } 
serde = {workspace=true}
serde_json = {workspace = true}
tokio = { workspace = true, features = ["signal","rt-multi-thread", "macros"] }
tokio-util = {workspace=true}
