[package]
name = "opentrace-bpf"
publish.workspace = true
edition.workspace = true
version.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Core eBPF communication library for kernel data collection"

[lib]
name = "opentrace_bpf"  
path = "src/lib.rs"          
crate-type = ["lib"]        

[features]
default = []
testing = []

[build-dependencies]
libbpf-cargo = "0.26.2"
vmlinux = { git = "https://github.com/libbpf/vmlinux.h.git", rev = "83a228cf37fc65f2d14e4896a04922b5ee531a94" }

[dependencies]
libbpf-rs = {workspace = true}
libc = { workspace = true } 
thiserror = { workspace = true } 
serde = {workspace=true}
serde_json = {workspace = true}
tokio = {workspace=true}
tokio-util = {workspace=true}
blazesym = "0.2"
paste = "1"

[dev-dependencies]
opentrace-bpf = { path = ".", features = ["testing"] }
tokio-test = "0.4.5"
rstest = "0.26.1"
tempfile = "3"
criterion = { version = "0.5", features = ["cargo_bench_support"] }

[[bench]]
name = "exporters"
harness = false

[[bench]]
name = "protocols"
harness = false

[[bench]]
name = "types"
harness = false

[[bench]]
name = "utils"
harness = false
